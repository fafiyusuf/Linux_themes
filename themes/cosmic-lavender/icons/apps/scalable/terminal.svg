<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Terminal icon — Cosmic Lavender palette -->
  <rect x="4" y="4" width="40" height="40" rx="8" fill="#191625"/>
  <rect x="4" y="4" width="40" height="10" rx="8" fill="#2D1B69"/>
  <rect x="4" y="10" width="40" height="4" fill="#2D1B69"/>
  <!-- Traffic lights -->
  <circle cx="12" cy="9" r="2.5" fill="#F28B82"/>
  <circle cx="20" cy="9" r="2.5" fill="#F5C77A"/>
  <circle cx="28" cy="9" r="2.5" fill="#8FD694"/>
  <!-- Prompt -->
  <text x="10" y="27" font-family="monospace" font-size="8" fill="#B58CFF">$</text>
  <rect x="16" y="21" width="20" height="2" rx="1" fill="#F4EEFF" opacity="0.6"/>
  <rect x="10" y="31" width="14" height="2" rx="1" fill="#F4EEFF" opacity="0.35"/>
  <!-- Cursor blink -->
  <rect x="25" y="29" width="5" height="2" rx="0.5" fill="#B58CFF" opacity="0.9"/>
</svg>
