<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <!-- Deep space gradient -->
    <radialGradient id="nebula" cx="60%" cy="40%" r="70%">
      <stop offset="0%"   stop-color="#2D1B69" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#1a0e40" stop-opacity="1"/>
      <stop offset="100%" stop-color="#11101A" stop-opacity="1"/>
    </radialGradient>

    <!-- Secondary nebula -->
    <radialGradient id="nebula2" cx="20%" cy="75%" r="50%">
      <stop offset="0%"   stop-color="#B58CFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#11101A" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter for stars -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="3840" height="2160" fill="url(#nebula)"/>
  <rect width="3840" height="2160" fill="url(#nebula2)"/>

  <!-- Star field — varied sizes and opacities -->
  <!-- Large bright stars -->
  <circle cx="320"  cy="180"  r="1.8" fill="#F4EEFF" opacity="0.95" filter="url(#glow)"/>
  <circle cx="890"  cy="420"  r="2.2" fill="#E3C8FF" opacity="0.9"  filter="url(#glow)"/>
  <circle cx="1540" cy="95"   r="1.5" fill="#F4EEFF" opacity="0.85"/>
  <circle cx="2100" cy="310"  r="2.5" fill="#B58CFF" opacity="0.8"  filter="url(#glow)"/>
  <circle cx="2780" cy="140"  r="1.8" fill="#F4EEFF" opacity="0.9"/>
  <circle cx="3200" cy="380"  r="2.0" fill="#E3C8FF" opacity="0.85" filter="url(#glow)"/>
  <circle cx="3640" cy="220"  r="1.6" fill="#F4EEFF" opacity="0.8"/>
  <circle cx="480"  cy="680"  r="1.4" fill="#E3C8FF" opacity="0.75"/>
  <circle cx="1200" cy="540"  r="2.0" fill="#F4EEFF" opacity="0.9"  filter="url(#glow)"/>
  <circle cx="1880" cy="720"  r="1.5" fill="#B58CFF" opacity="0.7"/>
  <circle cx="2450" cy="580"  r="2.2" fill="#F4EEFF" opacity="0.85" filter="url(#glow)"/>
  <circle cx="3100" cy="650"  r="1.7" fill="#E3C8FF" opacity="0.8"/>
  <circle cx="3720" cy="490"  r="1.4" fill="#F4EEFF" opacity="0.75"/>

  <!-- Mid-field stars -->
  <circle cx="150"  cy="350"  r="1.0" fill="#F4EEFF" opacity="0.6"/>
  <circle cx="620"  cy="290"  r="0.8" fill="#E3C8FF" opacity="0.55"/>
  <circle cx="740"  cy="810"  r="1.1" fill="#F4EEFF" opacity="0.65"/>
  <circle cx="1050" cy="720"  r="0.9" fill="#F4EEFF" opacity="0.5"/>
  <circle cx="1360" cy="460"  r="1.2" fill="#E3C8FF" opacity="0.6"/>
  <circle cx="1650" cy="830"  r="0.8" fill="#F4EEFF" opacity="0.55"/>
  <circle cx="1960" cy="180"  r="1.0" fill="#B58CFF" opacity="0.5"/>
  <circle cx="2230" cy="780"  r="1.1" fill="#F4EEFF" opacity="0.6"/>
  <circle cx="2560" cy="340"  r="0.9" fill="#E3C8FF" opacity="0.55"/>
  <circle cx="2900" cy="820"  r="1.2" fill="#F4EEFF" opacity="0.65"/>
  <circle cx="3350" cy="260"  r="0.8" fill="#F4EEFF" opacity="0.5"/>
  <circle cx="3580" cy="700"  r="1.0" fill="#E3C8FF" opacity="0.6"/>

  <!-- Small background stars -->
  <circle cx="200"  cy="500"  r="0.5" fill="#F4EEFF" opacity="0.4"/>
  <circle cx="390"  cy="900"  r="0.6" fill="#E3C8FF" opacity="0.35"/>
  <circle cx="560"  cy="420"  r="0.4" fill="#F4EEFF" opacity="0.45"/>
  <circle cx="830"  cy="1050" r="0.5" fill="#F4EEFF" opacity="0.38"/>
  <circle cx="1100" cy="310"  r="0.6" fill="#E3C8FF" opacity="0.42"/>
  <circle cx="1430" cy="950"  r="0.5" fill="#F4EEFF" opacity="0.4"/>
  <circle cx="1720" cy="420"  r="0.4" fill="#B58CFF" opacity="0.35"/>
  <circle cx="2020" cy="880"  r="0.6" fill="#F4EEFF" opacity="0.42"/>
  <circle cx="2320" cy="130"  r="0.5" fill="#E3C8FF" opacity="0.38"/>
  <circle cx="2680" cy="960"  r="0.4" fill="#F4EEFF" opacity="0.4"/>
  <circle cx="2980" cy="480"  r="0.6" fill="#F4EEFF" opacity="0.45"/>
  <circle cx="3280" cy="940"  r="0.5" fill="#E3C8FF" opacity="0.38"/>
  <circle cx="3550" cy="370"  r="0.4" fill="#F4EEFF" opacity="0.4"/>
  <circle cx="3790" cy="820"  r="0.5" fill="#B58CFF" opacity="0.35"/>

  <!-- Lower half stars -->
  <circle cx="280"  cy="1300" r="1.4" fill="#F4EEFF" opacity="0.5"/>
  <circle cx="720"  cy="1580" r="1.1" fill="#E3C8FF" opacity="0.45"/>
  <circle cx="1180" cy="1240" r="0.9" fill="#F4EEFF" opacity="0.4"/>
  <circle cx="1600" cy="1700" r="1.3" fill="#B58CFF" opacity="0.4"/>
  <circle cx="2080" cy="1380" r="1.0" fill="#F4EEFF" opacity="0.45"/>
  <circle cx="2500" cy="1620" r="0.8" fill="#E3C8FF" opacity="0.38"/>
  <circle cx="2900" cy="1280" r="1.2" fill="#F4EEFF" opacity="0.5"/>
  <circle cx="3380" cy="1550" r="1.0" fill="#F4EEFF" opacity="0.42"/>
  <circle cx="3750" cy="1350" r="0.8" fill="#E3C8FF" opacity="0.38"/>

  <!-- Central nebula cloud (soft) -->
  <ellipse cx="1920" cy="900" rx="900" ry="400"
           fill="#7B61C9" opacity="0.06"/>
  <ellipse cx="1600" cy="700" rx="600" ry="250"
           fill="#B58CFF" opacity="0.04"/>

  <!-- Subtle horizon glow at bottom -->
  <rect x="0" y="1800" width="3840" height="360"
        fill="url(#nebula)" opacity="0.5"/>
</svg>
